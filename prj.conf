# Robotic Dog - legs firmware configuration (Teensy 4.1, Zephyr v4.4)

# ---- C++20 --------------------------------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP20=y
# Full C++ standard library: std::array, std::span, std::atomic, <algorithm>, ...
CONFIG_REQUIRES_FULL_LIBCPP=y

# ---- Floating point -----------------------------------------------------------
# The Teensy 4.1 board leaves the hardware FPU off; without this, float math is
# done in software. FPU_SHARING saves FPU registers when threads switch (the
# control and supervisor threads both use floats).
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ---- Console over the Teensy's USB cable (shows up as a COM port) --------------
# printk() and log output go here. Same settings as Zephyr's cdc-acm-console
# snippet; app.overlay points the console at this USB serial port instead of the
# board's default console UART.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
# This USB port also carries the log output, so its own driver can't log (it
# would loop). Zephyr turns that log off anyway and warns at build time; saying
# it here silences the warning.
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

# ---- Networking: static IPv4, no DHCP (Conventions.md) -------------------------
# scripts/02_build builds one firmware per leg and overrides the address (and
# LEG_ID) from scripts/legs.csv. The default below is Front Right, LEG_ID 0.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.11"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_DHCPV4=n
# Don't block boot waiting for the Ethernet link (default is 30 s). Zephyr
# assigns the static address whether or not the wait finishes, so with a
# static IP there is nothing to wait for: traffic flows once the link is up.
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# ---- Peripherals ---------------------------------------------------------------
# Until app.overlay enables a PWM node, CMake prints "No SOURCES given to Zephyr
# library: drivers__pwm". That warning is harmless.
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_WATCHDOG=y

# ---- Diagnostics ---------------------------------------------------------------
# INIT_STACKS + THREAD_STACK_INFO power the supervisor's stack-margin check on
# its four threads (k_thread_stack_space_get).
CONFIG_LOG=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# ---- Stacks --------------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

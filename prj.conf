# Robotic Dog - legs firmware configuration (Teensy 4.1, Zephyr v4.4)

# ---- C++20 --------------------------------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP20=y
# Full C++ standard library: std::array, std::span, std::string, <algorithm>, ...
CONFIG_REQUIRES_FULL_LIBCPP=y

# ---- Floating point -----------------------------------------------------------
# The Teensy 4.1 board leaves the hardware FPU off; without this, float math is
# done in software. FPU_SHARING saves FPU registers when threads switch.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ---- LED ----------------------------------------------------------------------
CONFIG_GPIO=y

# ---- Console over the Teensy's USB cable (shows up as a COM port) --------------
# printk() output goes here. Same settings as Zephyr's cdc-acm-console snippet;
# app.overlay points the console at this USB serial port instead of the
# board's default console UART.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
